<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="container">
      <div class="header">
        <div class="title">Currency &rarr; RUB</div>
        <div class="subtitle">Конвертер цен Steam</div>
      </div>

      <div class="updated" id="updated-time"></div>

      <div class="rate-list" id="rate-list">
        <div class="loading">Загрузка курсов&hellip;</div>
      </div>

      <button id="refresh" class="btn-refresh">
        <span class="btn-label">Обновить курсы</span>
      </button>

      <div class="footer">Любая валюта на Steam автоматически конвертируется в рубли</div>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
